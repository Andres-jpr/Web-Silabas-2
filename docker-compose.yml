services:
  silabas-encantadas:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: silabas_encantadas_app
    restart: unless-stopped
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
