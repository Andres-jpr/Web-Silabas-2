<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sílabas Encantadas: Videojuego educativo interactivo de aventura para aprender la clasificación de palabras por número de sílabas.">
  <title>Sílabas Encantadas ✨ Árbol de las Palabras</title>

  <!-- Google Fonts: Fredoka & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">

  <!-- Estilos Inspirados en Árbol ABC -->
  <link rel="stylesheet" href="css/enchanted.css?v=3.2">

  <!-- GSAP y Confetti -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
</head>
<body>

  <!-- ===================================================================
       CABECERA SUPERIOR: TÍTULO, SELECTOR DE EDAD Y MÚSICA
       =================================================================== -->
  <header class="game-top-title-bar">
    <div class="title-row-container">
      <h1 class="game-main-title">Sílabas encantadas</h1>
      <div class="header-action-group">
        <button class="music-toggle-btn" id="btn-music-toggle" title="Activar/desactivar música de fondo">
          🎵 Música: OFF
        </button>
        <button class="fullscreen-toggle-btn" id="btn-fullscreen-toggle" title="Alternar modo pantalla completa">
          ⛶ Pantalla completa
        </button>
      </div>
    </div>

    <!-- Selector de Edades (Máximo 10 años) -->
    <div class="age-selector-container" role="radiogroup" aria-label="Selecciona la edad">
      <span class="age-selector-label">Nivel de Edad:</span>
      <button class="age-pill-btn" data-age="5-6" title="Palabras cortas y visuales (1 y 2 sílabas)">
        <span>🐣</span> 5 - 6 años
      </button>
      <button class="age-pill-btn" data-age="7-8" title="Palabras intermedias (2 y 3 sílabas)">
        <span>🚀</span> 7 - 8 años
      </button>
      <button class="age-pill-btn active" data-age="9-10" title="Palabras avanzadas (3, 4 y más sílabas)">
        <span>🌟</span> 9 - 10 años
      </button>
    </div>
  </header>

  <!-- ===================================================================
       ESCENARIO DEL JUEGO: EL CAMINO ENCANTADO + MARCO DERECHO + BOTONES
       =================================================================== -->
  <main class="game-world-stage">

    <!-- Paisaje decorativo en los laterales -->
    <div class="stage-scenery-left"></div>
    <div class="stage-scenery-right"></div>

    <!-- Bordes de azulejos del camino -->
    <div class="stage-path-border-top"></div>
    <div class="stage-path-border-bottom"></div>

    <!-- Barra de progreso segmentada y racha de estrellas (Top-Left) -->
    <div class="segmented-progress-box" title="Progreso de la aventura">
      <div class="progress-segment filled"></div>
      <div class="progress-segment"></div>
      <div class="progress-segment"></div>
      <div class="progress-segment"></div>
      <div class="progress-segment"></div>
      <div class="progress-segment"></div>
      <div class="streak-stars-badge" id="streak-stars-count" title="Racha de aciertos seguidos">⭐ 0</div>
    </div>

    <!-- Nube flotante de feedback -->
    <div class="feedback-floating-cloud" id="floating-cloud-feedback">
      ¡Excelente! ✨
    </div>

    <!-- El Ratón Animado e Interactivo (Con boca sincronizada y ojos tiernos) -->
    <div class="stage-character-walker" id="character-walker" title="¡Haz clic en el ratoncito para que te salude!">
      <!-- Indicador visual cuando Silabín está hablando -->
      <div class="mouse-speech-bubble" id="mouse-speech-badge">🐭 Hablando...</div>

      <svg class="character-svg" viewBox="0 0 110 140" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Cola que se balancea de forma tierna -->
        <path class="raton-tail" d="M 28 108 Q 8 115 14 135" stroke="#9575CD" stroke-width="4" stroke-linecap="round" fill="none"/>

        <!-- Oreja Izquierda con movimiento suave -->
        <g class="raton-ear-left">
          <circle cx="28" cy="30" r="16" fill="#7E57C2"/>
          <circle cx="28" cy="30" r="9" fill="#F48FB1"/>
        </g>

        <!-- Oreja Derecha con movimiento suave -->
        <g class="raton-ear-right">
          <circle cx="80" cy="30" r="16" fill="#7E57C2"/>
          <circle cx="80" cy="30" r="9" fill="#F48FB1"/>
        </g>

        <!-- Gorro de explorador naranja -->
        <ellipse cx="54" cy="24" rx="30" ry="13" fill="#E64A19"/>
        <path d="M 40 20 Q 54 11 68 20" stroke="#FFC107" stroke-width="4" stroke-linecap="round" fill="none"/>
        <circle cx="54" cy="11" r="5" fill="#FFC107"/>

        <!-- Cabeza violeta -->
        <ellipse cx="54" cy="46" rx="28" ry="25" fill="#9575CD"/>
        
        <!-- Ojos ESTABLES Y SEGUROS (Sin ninguna deformación) -->
        <ellipse cx="43" cy="42" rx="6" ry="7" fill="#FFFFFF"/>
        <circle cx="44" cy="42" r="3.5" fill="#212121"/>
        <circle cx="45" cy="40" r="1.5" fill="#FFFFFF"/>

        <ellipse cx="65" cy="42" rx="6" ry="7" fill="#FFFFFF"/>
        <circle cx="66" cy="42" r="3.5" fill="#212121"/>
        <circle cx="67" cy="40" r="1.5" fill="#FFFFFF"/>

        <!-- Hocico rosado dulce -->
        <ellipse cx="54" cy="51" rx="9" ry="6" fill="#FFF9C4"/>
        <ellipse cx="54" cy="48" rx="4" ry="3" fill="#E91E63"/>

        <!-- Bigotes -->
        <g class="raton-whiskers">
          <line x1="32" y1="50" x2="16" y2="47" stroke="#424242" stroke-width="2" stroke-linecap="round"/>
          <line x1="32" y1="54" x2="16" y2="57" stroke="#424242" stroke-width="2" stroke-linecap="round"/>
          <line x1="76" y1="50" x2="92" y2="47" stroke="#424242" stroke-width="2" stroke-linecap="round"/>
          <line x1="76" y1="54" x2="92" y2="57" stroke="#424242" stroke-width="2" stroke-linecap="round"/>
        </g>

        <!-- Sonrisa y boca sincronizada con el habla -->
        <path id="raton-mouth" d="M 48 55 Q 54 60 60 55" stroke="#333" stroke-width="2.5" stroke-linecap="round" fill="none"/>

        <!-- Camisa verde y bolso de explorador -->
        <path d="M 34 72 L 74 72 L 78 108 L 30 108 Z" fill="#26A69A" rx="4"/>
        <line x1="36" y1="72" x2="72" y2="108" stroke="#FF9800" stroke-width="6" stroke-linecap="round"/>
        <rect x="64" y="96" width="18" height="15" rx="4" fill="#BF360C"/>

        <!-- Manitas -->
        <circle cx="28" cy="85" r="7" fill="#9575CD"/>
        <circle cx="80" cy="85" r="7" fill="#9575CD"/>

        <!-- Patitas y zapatos rojos -->
        <rect x="38" y="108" width="9" height="18" rx="3" fill="#E65100"/>
        <ellipse cx="42" cy="128" rx="11" ry="6" fill="#D32F2F"/>

        <rect x="60" y="108" width="9" height="18" rx="3" fill="#E65100"/>
        <ellipse cx="64" cy="128" rx="11" ry="6" fill="#D32F2F"/>
      </svg>
    </div>

    <!-- Animación Visual de Palmadas en Pantalla -->
    <div class="visual-clapping-overlay" id="visual-clapping-hands" aria-hidden="true">
      <div class="clapping-hands-icon">👏</div>
      <div class="clapping-counter-badge" id="clapping-counter-badge">1</div>
      <div class="clapping-current-syllable" id="clapping-current-syllable">¡Pal-ma-da!</div>
    </div>

    <!-- Tarjeta Ilustrada 3D Grande a la Derecha -->
    <div class="target-word-frame-card" id="target-word-card" title="¡Haz clic en la tarjeta para escuchar la palabra!">
      <div class="card-sound-indicator">🔊 Toca para escuchar</div>
      <div class="card-illustration-circle" id="card-illustration">
        👨‍🚀
      </div>
      <div class="card-word-title" id="card-word-title">
        Astronauta
      </div>
      <div class="card-fact-text" id="card-fact-text">
        💡 Piloto que explora galaxias lejanas
      </div>
      <!-- Contenedor interactivo de fichas de sílabas -->
      <div class="card-syllables-wrapper" id="card-syllable-reveal">
        <!-- Fichas interactivas inyectadas por JS -->
      </div>
    </div>

    <!-- Botones Gelatina 3D en el Camino -->
    <div class="stepping-stones-row" role="group" aria-label="Opciones de clasificación de sílabas">
      <button class="jelly-stone-btn stone-mono" data-syllable-count="1" title="1 Sílaba">
        <span class="stone-value-text">1</span>
        <span class="stone-label-sub">Monosílaba</span>
      </button>

      <button class="jelly-stone-btn stone-bi" data-syllable-count="2" title="2 Sílabas">
        <span class="stone-value-text">2</span>
        <span class="stone-label-sub">Bisílaba</span>
      </button>

      <button class="jelly-stone-btn stone-tri" data-syllable-count="3" title="3 Sílabas">
        <span class="stone-value-text">3</span>
        <span class="stone-label-sub">Trisílaba</span>
      </button>

      <button class="jelly-stone-btn stone-poli" data-syllable-count="4" title="4 o más Sílabas">
        <span class="stone-value-text">4+</span>
        <span class="stone-label-sub">Polisílaba</span>
      </button>
    </div>

  </main>

  <!-- ===================================================================
       BOTONES INFERIORES NATIVOS Y ROBUSTOS
       =================================================================== -->
  <footer class="bottom-nav-controls" role="toolbar" aria-label="Controles de audio y navegación">
    <!-- Botón Escuchar -->
    <button type="button" class="nav-action-btn" id="btn-nav-speak" title="Escuchar pronunciación y sonido">
      <span class="round-nav-circle btn-cyan-nav">
        <span class="nav-btn-icon">🔊</span>
      </span>
      <span class="nav-btn-text-badge">Escuchar</span>
    </button>

    <!-- Botón Silabear con Palmadas -->
    <button type="button" class="nav-action-btn" id="btn-nav-syllables" title="Dar palmadas y contar las sílabas">
      <span class="round-nav-circle btn-green-nav">
        <span class="nav-btn-icon">👏</span>
      </span>
      <span class="nav-btn-text-badge">Palmadas</span>
    </button>

    <!-- Botón Siguiente -->
    <button type="button" class="nav-action-btn" id="btn-nav-reset" title="Pasar a la siguiente palabra">
      <span class="round-nav-circle btn-purple-nav">
        <span class="nav-btn-icon">🔄</span>
      </span>
      <span class="nav-btn-text-badge">Siguiente</span>
    </button>
  </footer>

  <!-- Modal de Diploma de Victoria -->
  <div class="diploma-modal-backdrop" id="diploma-victory-modal">
    <div class="diploma-card">
      <div class="diploma-trophy">🏆</div>
      <h2 class="diploma-title">¡FELICITACIONES!</h2>
      <p class="diploma-sub">Has completado todo el camino de las sílabas con éxito.</p>
      <div class="diploma-badge-ribbon">
        🌟 Gran Maestro de las Sílabas 🌟
      </div>
      <div>
        <button class="btn-diploma-play" id="btn-diploma-play-again">
          ¡JUGAR DE NUEVO! ✨
        </button>
      </div>
    </div>
  </div>

  <!-- Script del Juego Encantado -->
  <script src="js/enchantedGame.js?v=4.1"></script>
</body>
</html>
